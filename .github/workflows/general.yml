---
# yaml-language-server: $schema=https://www.schemastore.org/github-workflow.json
name: general

"on":
  workflow_dispatch:
  push:
    branches:
      - master
  pull_request:
    branches:
      - master

permissions:
  contents: read
  code-quality: write

jobs:
  lint:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout source
        uses: actions/checkout@v7

      - name: Install tools
        uses: jdx/mise-action@v4

      - name: Run linter
        uses: golangci/golangci-lint-action@v9
        with:
          version: v2.13.2
          install-mode: goinstall

  chart:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout source
        uses: actions/checkout@v7

      - name: Install tools
        uses: jdx/mise-action@v4

      - name: Lint chart
        run: |
          helm lint ./chart

      - name: Create cluster
        run: |
          kind create cluster

      - name: Prepare image
        run: |
          make docker-build IMG=keycloak-operator:0.0.0
          kind load docker-image keycloak-operator:0.0.0

      - name: Install chart
        run: |
          helm install \
            my-release \
            ./chart \
            --create-namespace \
            --namespace keycloak-operator \
            --set image.repository=keycloak-operator \
            --set image.tag=0.0.0 \
            --set image.imagePullPolicy=IfNotPresent

      - name: Check status
        run: |
          helm status \
            my-release \
            --namespace keycloak-operator

  tests:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout source
        uses: actions/checkout@v7

      - name: Install tools
        uses: jdx/mise-action@v4

      - name: Run tests
        run: make test

      - name: Upload coverage
        if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
        uses: actions/upload-code-coverage@v1
        with:
          file: cover.xml
          language: Go
          label: coverage/go

  e2e:
    runs-on: ubuntu-latest

    needs:
      - lint
      - chart
      - tests

    strategy:
      fail-fast: false
      matrix:
        externaldns:
          - "0.21.0"

    steps:
      - name: Checkout source
        uses: actions/checkout@v7

      - name: Install tools
        uses: jdx/mise-action@v4

      - name: Run tests
        run: make test-e2e
        env:
          EXTERNAL_DNS_VERSION: ${{ matrix.externaldns }}

...
